# Custom rules Semgrep cho Checkease — chỉ rule trong thư mục này mới được đọc `hard_gate`
# Mỗi rule bắt buộc có: metadata.category, metadata.checkease_severity, metadata.hard_gate (nếu áp dụng)
# Thêm metadata.impact / metadata.confidence để ma trận severity (mục 8.4) có đủ đầu vào.
rules:
  # 1. Hardcoded secret (Python) — hard gate
  - id: checkease-hardcoded-secret
    languages: [python]
    message: "Hardcoded secret/credential trong mã nguồn — đưa vào biến môi trường hoặc secrets manager."
    severity: ERROR
    metadata:
      category: security
      checkease_severity: Critical
      hard_gate: true
      cwe: CWE-798
      impact: HIGH
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: $KEY = "..."
          - pattern: $KEY = '...'
          - pattern: $KEY = f"..."
      - metavariable-regex:
          metavariable: $KEY
          regex: "(?i).*(secret|password|passwd|api_key|apikey|token|credential).*"
      # Loại giá trị giữ chỗ để giảm dương tính giả (mục 3, 8.6)
      - pattern-not-regex: '(?i)(changeme|your[_-]|example|placeholder|dummy|xxxx|<.+>|\$\{)'

  # 2. SQL Injection thô (nối chuỗi vào query) — hard gate
  - id: checkease-sql-injection
    languages: [python]
    message: "SQL Injection: nối chuỗi vào query — dùng parameterized query."
    severity: ERROR
    metadata:
      category: security
      checkease_severity: Critical
      hard_gate: true
      cwe: CWE-89
      impact: HIGH
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $CUR.execute($Q + $X)
          - pattern: $CUR.execute(f"...{$X}...")
          - pattern: $CUR.execute("..." % ($X, ...))

  # 3. eval()/exec() với input không đáng tin
  - id: checkease-eval-exec
    languages: [python]
    message: "eval()/exec() — nguy cơ code injection nếu input không được kiểm soát."
    severity: WARNING
    metadata:
      category: security
      checkease_severity: Major
      hard_gate: false
      cwe: CWE-95
      impact: MEDIUM
      confidence: MEDIUM
    patterns:
      - pattern-either:
          - pattern: eval(...)
          - pattern: exec(...)

  # 4. assert dùng để kiểm tra input (bị tắt khi chạy python -O)
  - id: checkease-assert-in-code
    languages: [python]
    message: "assert dùng để validate input — sẽ bị bỏ khi Python chạy với -O."
    severity: INFO
    metadata:
      category: reliability
      checkease_severity: Minor
      hard_gate: false
      impact: LOW
      confidence: HIGH
    pattern: assert $X, $MSG

  # 5. So sánh None bằng == thay vì is
  - id: checkease-none-comparison
    languages: [python]
    message: "So sánh None bằng == thay vì is — có thể bị override __eq__."
    severity: INFO
    metadata:
      category: maintainability
      checkease_severity: Minor
      hard_gate: false
      impact: LOW
      confidence: HIGH
    pattern: $X == None
