<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Checkease — Release Readiness Gateway{% endblock %}</title>
  
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}" />
  <link rel="stylesheet" href="{% static 'css/base.css' %}" />
  <link rel="stylesheet" href="{% static 'css/components.css' %}" />
  
  <!-- HTMX & Alpine.js -->
  <script src="https://unpkg.com/htmx.org@1.9.10" integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}' hx-target="#main-content" hx-select="#main-content" hx-swap="outerHTML">
  
  {% block shell %}
  <div class="ce-shell">
    {% include 'layouts/sidebar.html' %}
    
    <div class="ce-main">
      
      
      <div class="ce-content u-fade-in" id="main-content">
        {% block content %}{% endblock %}
      </div>
    </div>
  </div>
  {% endblock %}
  
  <script src="{% static 'js/app.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
