<span class="ce-delta {% if delta > 0.05 %}up{% elif delta < -0.05 %}down{% else %}flat{% endif %}" title="So với phiên bản trước">
  {% if delta > 0.05 %}
    <svg class="ce-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 7-8.5 8.5-5-5L2 17"/><path d="M16 7h6v6"/></svg>
    <span>+{{ delta|floatformat:1 }}</span>
  {% elif delta < -0.05 %}
    <svg class="ce-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 17-8.5-8.5-5 5L2 7"/><path d="M16 17h6v-6"/></svg>
    <span>{{ delta|floatformat:1 }}</span>
  {% else %}
    <svg class="ce-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/></svg>
    <span>0.0</span>
  {% endif %}
</span>
