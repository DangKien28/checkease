<div class="ce-empty">
  <div class="ico">
    <svg class="ce-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <use href="#icon-{{ icon|default:'projects' }}"></use>
    </svg>
  </div>
  <div class="t">{{ title|default:'Chưa có dữ liệu' }}</div>
  {% if desc %}
    <div class="d">{{ desc }}</div>
  {% endif %}
  {% if action_html %}
    <div class="u-mt-4">{{ action_html|safe }}</div>
  {% endif %}
</div>
