{% load static %}
<aside class="ce-sidebar">
  <div class="ce-sidebar__brand" style="flex-direction: column; align-items: flex-start; gap: 8px; padding: 24px 18px 16px;">
    <img src="{% static 'images/logo_checkease.png' %}" alt="Checkease Logo" style="width: 56px; height: 56px; object-fit: contain;" />
    <div style="margin-top: 4px;">
      <span style="font-family: 'Brush Script MT', 'Segoe Script', 'Comic Sans MS', cursive; font-size: 28px; font-weight: normal; line-height: 1; color: var(--brand-600); display: block; margin-bottom: 2px;">Checkease</span>
      <small style="display: block; font-size: 10px; font-weight: 500; color: var(--text-3); letter-spacing: 0.05em;">RELEASE READINESS GATEWAY</small>
    </div>
  </div>
  
  <nav class="ce-nav">
    <a class="ce-nav__item {% if request.path == '/overview/' %}is-active{% endif %}" href="/overview/" hx-get="/overview/" hx-target="#main-content" hx-push-url="true">
      <span class="ce-nav__icon">
        <svg class="ce-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1.2"/><rect width="7" height="5" x="14" y="3" rx="1.2"/><rect width="7" height="9" x="14" y="12" rx="1.2"/><rect width="7" height="5" x="3" y="16" rx="1.2"/></svg>
      </span>Tổng quan
    </a>
    <a class="ce-nav__item {% if request.path == '/projects/' %}is-active{% endif %}" href="/projects/" hx-get="/projects/" hx-target="#main-content" hx-push-url="true">
      <span class="ce-nav__icon">
        <svg class="ce-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13c0 1.1.9 2 2 2Z"/></svg>
      </span>Dự án
    </a>
    <a class="ce-nav__item {% if request.path == '/settings/' %}is-active{% endif %}" href="/settings/" hx-get="/settings/" hx-target="#main-content" hx-push-url="true">
      <span class="ce-nav__icon">
        <svg class="ce-icon" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>Cài đặt
    </a>
  </nav>
  <div class="ce-sidebar__spacer"></div>
  <div class="ce-sidebar__user">
    <span class="ce-avatar">{{ request.user.username|default:"U"|slice:":2"|upper }}</span>
    <div class="info">
      <div class="name u-ellipsis">{{ request.user.username|default:"Guest" }}</div>
      <div class="mail u-ellipsis">{{ request.user.email|default:"" }}</div>
    </div>
    <button class="logout-btn" title="Đăng xuất">
      <svg class="ce-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>
    </button>
  </div>
</aside>
