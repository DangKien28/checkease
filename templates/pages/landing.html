<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Checkease - Giới thiệu</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/tokens.css' %}" />
  <link rel="stylesheet" href="{% static 'css/base.css' %}" />
  <link rel="stylesheet" href="{% static 'css/components.css' %}" />
  <style>
    .hero { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg-body); text-align: center; padding: 20px; }
    .hero h1 { font-size: 3rem; margin-bottom: 20px; color: var(--text-1); }
    .hero p { font-size: 1.25rem; color: var(--text-2); max-width: 600px; margin-bottom: 40px; line-height: 1.6; }
    .hero .actions { display: flex; gap: 16px; }
  </style>
</head>
<body>
  <div class="hero">
    <img src="{% static 'images/logo_checkease.png' %}" alt="Checkease Logo" style="width: 80px; height: 80px; object-fit: contain; margin-bottom: 20px;" />
    <h1 style="font-family: 'Brush Script MT', 'Segoe Script', 'Comic Sans MS', cursive; font-size: 4rem; color: var(--brand-600); font-weight: normal; margin-bottom: 20px;">Checkease</h1>
    <p>Giải pháp tối ưu đánh giá tính sẵn sàng phát hành phần mềm tự động dựa trên chất lượng mã nguồn và tài liệu kiểm thử.</p>
    <div class="actions">
      <a href="/login/" class="ce-btn ce-btn--primary ce-btn--lg">Đăng nhập</a>
      <a href="/register/" class="ce-btn ce-btn--secondary ce-btn--lg">Đăng ký</a>
    </div>
  </div>
</body>
</html>
