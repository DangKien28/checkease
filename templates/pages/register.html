{% extends "layouts/auth_base.html" %}
{% block title %}Đăng ký - Checkease{% endblock %}
{% block content %}
<div class="ce-card">
  <div class="ce-card__body">
    <h2 style="font-size:21px">Đăng ký tài khoản</h2>
    <p class="u-muted" style="margin:6px 0 22px;font-size:13.5px">Tạo không gian làm việc mới cho tổ chức của bạn.</p>
    <form action="/register/" method="POST">
      {% csrf_token %}
      <div class="ce-field">
        <label class="ce-label">Họ tên</label>
        <input type="text" name="name" class="ce-input" placeholder="Nguyễn Văn A" required />
      </div>
      <div class="ce-field u-mt-3">
        <label class="ce-label">Email</label>
        <input type="email" name="email" class="ce-input" placeholder="ban@congty.vn" required />
      </div>
      <div class="ce-field u-mt-3">
        <label class="ce-label">Mật khẩu</label>
        <input type="password" name="password" class="ce-input" placeholder="••••••••" required />
      </div>
      <button type="submit" class="ce-btn ce-btn--primary ce-btn--lg ce-btn--block u-mt-4">Đăng ký</button>
    </form>
    <div class="u-mt-4" style="text-align:center;font-size:13.5px;color:var(--text-3)">
      Đã có tài khoản? <a href="/login/" style="font-weight:700">Đăng nhập</a>
    </div>
  </div>
</div>
{% endblock %}
